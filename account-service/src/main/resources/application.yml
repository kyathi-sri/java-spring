server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: account-service
  datasource:
    # Credentials are NEVER in source. Supply via environment / secret store.
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/account_db}
    username: ${ACCOUNT_DB_USER}
    password: ${ACCOUNT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, Hibernate only validates
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

securebank:
  security:
    # HMAC secret (>= 32 bytes) used to validate JWTs locally. In AWS, replace with an
    # issuer-uri / jwk-set-uri of a real IdP (Cognito/Keycloak). Never hard-code.
    jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
