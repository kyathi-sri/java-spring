# Local SecureBank stack: PostgreSQL (one DB per service), Kafka (KRaft), and the services.
#
#   .\mvnw.cmd clean verify          # build + test the jars the images copy
#   .\scripts\new-local-env.ps1      # once: create .env with random local secrets
#   docker compose up -d --build
#
# Host ports: services 8081-8083, PostgreSQL 55432 (not 5432, to avoid clashing with a local
# PostgreSQL install), Kafka 9094.
name: securebank

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:?set ACCOUNT_DB_PASSWORD in .env}
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD:?set TRANSACTION_DB_PASSWORD in .env}
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD:?set TRANSFER_DB_PASSWORD in .env}
    volumes:
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka-native:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"

  account-service:
    build:
      context: .
      dockerfile: account-service/Dockerfile
    image: securebank/account-service:dev
    environment:
      ACCOUNT_DB_URL: jdbc:postgresql://postgres:5432/account_db
      ACCOUNT_DB_USER: account_svc
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  transaction-service:
    build:
      context: .
      dockerfile: transaction-service/Dockerfile
    image: securebank/transaction-service:dev
    environment:
      TRANSACTION_DB_URL: jdbc:postgresql://postgres:5432/transaction_db
      TRANSACTION_DB_USER: transaction_svc
      TRANSACTION_DB_PASSWORD: ${TRANSACTION_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    image: securebank/transfer-service:dev
    environment:
      TRANSFER_DB_URL: jdbc:postgresql://postgres:5432/transfer_db
      TRANSFER_DB_USER: transfer_svc
      TRANSFER_DB_PASSWORD: ${TRANSFER_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ACCOUNT_SERVICE_URL: http://account-service:8081
      TRANSACTION_SERVICE_URL: http://transaction-service:8082
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_healthy
      transaction-service:
        condition: service_healthy

volumes:
  pgdata:
